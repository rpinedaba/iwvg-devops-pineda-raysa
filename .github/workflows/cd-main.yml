name: CD - Main
on:
  push:
    branches: ['main']

env:
  REPOSITORY: ${{ github.repository }} # <user>/<repo>
  GHCR_URL: ghcr.io # GitHub Container Registry

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on AWS Lightsail
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Prepare container image metadata (repository in lowercase, artifact, version...)
        run: |
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV

      # 1º Crear Token de Acceso Personal
      # 2º Crear secret en GitHub
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest     

      - name: 🐳 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          script: |
            echo ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.REPOSITORY }}:latest
            docker rm -f ${{ env.ARTIFACT }} || true
            docker network inspect devopsNet >/dev/null 2>&1 || docker network create devopsNet
            
            # 💡 TRUCO SINCRO: Espera a que Postgres responda de forma efectiva antes de arrancar Java
            echo "⏳ Verificando si Postgres está listo..."
            for i in $(seq 1 12); do
              if docker exec postgres pg_isready -U "${{ secrets.POSTGRES_USER }}" >/dev/null 2>&1; then
                echo "✅ Postgres ya está respondiendo"
                break
              fi
              echo "Intento $i: Postgres sigue cargando, esperando 10 segundos..."
              sleep 10
            done

            # Comando optimizado con límites y variables para la JVM de Java
            docker run -d \
              --name ${{ env.ARTIFACT }} \
              -m 200m \
              --restart always \
              --network devopsNet \
              -p 10000:10000 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JAVA_OPTS="-Xmx140m -Xms64m" \
              -e POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              ghcr.io/${{ env.REPOSITORY }}:latest
            
            # Subimos a 12 intentos (3 minutos máximo) para dar tiempo al start-period del Dockerfile
            echo "⏳ Esperando a que el Healthcheck de la app responda..."
            for i in $(seq 1 12); do
              sleep 15
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.ARTIFACT }} 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] && break
            done
            
            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Deploy fallido"
              docker logs --tail 50 ${{ env.ARTIFACT }}
              exit 1
            fi
            
            echo "✅ Deploy exitoso"
            docker image prune --filter "until=12h" -f